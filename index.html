<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isbabi Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{--bg:#fafaf9;--card:#fff;--bd:#e7e5e4;--tx:#1c1917;--mu:#78716c;--hv:#f5f5f4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0c0c0e;--card:#141416;--bd:#27272a;--tx:#ededef;--mu:#8b8b93;--hv:#1c1c1f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mu);outline-offset:1px}
input,textarea{background:transparent;border:1px solid var(--bd);border-radius:6px;padding:4px 8px;color:var(--tx)}
input[type=color]{padding:0;width:28px;height:28px;cursor:pointer}
input[type=range]{padding:0;border:0;width:100%;accent-color:var(--tx)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;color:var(--mu)}
.ib:hover{background:var(--hv);color:var(--tx)}
.bt{border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--tx)}
.bt:hover{background:var(--hv)}
button{touch-action:manipulation}
@media (pointer:coarse){.ib{width:40px;height:40px}.bt{padding:8px 12px;font-size:13px}input[type=color]{width:36px;height:36px}}
@media (max-width:640px){input,textarea{font-size:16px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const IC={
plus:"M5 12h14M12 5v14",minus:"M5 12h14",x:"M18 6 6 18M6 6l12 12",up:"m18 15-6-6-6 6",down:"m6 9 6 6 6-6",
trash:"M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2",
sun:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4",
moon:"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z",
gear:"M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"};
const Ic=({n,s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d={IC[n]}/></svg>;

const K='habit-heatmap.v1',DN=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const PAL={emerald:'#10b981',amber:'#f59e0b',ocean:'#0ea5e9',rose:'#f43f5e',violet:'#8b5cf6'};
const DEF={theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',
 s:{pal:'emerald',base:'#10b981',empty:'',bg:'',size:13,gap:3,radius:25,period:'12m',ws:1,months:true,days:true,legend:true,binary:false,th:[1,3,5,10]},
 t:[{id:'a',name:'Lecture',d:{}},{id:'b',name:'Sport',d:{}}]};
const load=()=>{try{const o=JSON.parse(localStorage.getItem(K));if(o&&o.t)return{...DEF,...o,s:{...DEF.s,...o.s}}}catch(e){}return DEF};

const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const now=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
function range(p){const t=now(),y=t.getFullYear();
 if(p==='year')return[new Date(y,0,1,12),new Date(y,11,31,12)];
 if(p==='12m')return[add(t,-364),t];
 if(p==='6m')return[new Date(y,t.getMonth()-5,1,12),t];
 const q=Math.floor(t.getMonth()/3)*3;return[new Date(y,q,1,12),new Date(y,q+3,0,12)]}
function grid(p,ws){const[a,b]=range(p),s=add(a,-((a.getDay()-ws+7)%7)),n=Math.round((b-s)/864e5)+1,cols=Math.ceil(n/7),cells=[];
 for(let i=0;i<cols*7;i++){const d=add(s,i);cells.push({d,k:key(d),on:d>=a&&d<=b})}return{cols,cells}}
function stats(d){const ks=Object.keys(d).filter(k=>d[k].v>0).sort();let tot=0,best=0,run=0,prev=null;
 ks.forEach(k=>{tot+=d[k].v;const t=new Date(k+'T12:00:00');run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;best=Math.max(best,run)});
 let cur=0,c=now();if(!(d[key(c)]&&d[key(c)].v>0))c=add(c,-1);while(d[key(c)]&&d[key(c)].v>0){cur++;c=add(c,-1)}
 return{tot:Math.round(tot*100)/100,best,cur,days:ks.length}}

const okHex=h=>/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(h);
const h2r=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const r2h=(r,g,b)=>'#'+[r,g,b].map(v=>Math.min(255,+v).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=h2r(a),B=h2r(b);return`rgb(${A.map((v,i)=>Math.round(v*(1-t)+B[i]*t)).join(',')})`};
function palette(s,theme){
 const emp=s.empty||(theme==='dark'?'#27272a':'#ebebe8');
 const base=s.pal==='mono'?(theme==='dark'?'#e4e4e7':'#3f3f46'):s.pal==='custom'?s.base:PAL[s.pal];
 return[emp,...[.3,.55,.8,1].map(t=>mix(emp,base,t))]}
const level=(v,s)=>v>0?(s.binary?4:s.th.filter(t=>v>=t).length):0;

const Seg=({v,o,on})=><div className="flex gap-0.5 rounded-md border p-0.5" style={{borderColor:'var(--bd)'}}>{o.map(([k,l])=>
 <button key={k} onClick={()=>on(k)} className="flex-1 rounded px-2 py-1 text-xs" style={v===k?{background:'var(--hv)',color:'var(--tx)',boxShadow:'0 0 0 1px var(--bd)'}:{color:'var(--mu)'}}>{l}</button>)}</div>;
const Sec=({t,children})=><section className="space-y-3 border-b py-4" style={{borderColor:'var(--bd)'}}><h3 className="text-xs font-semibold" style={{color:'var(--mu)'}}>{t}</h3>{children}</section>;
const Rng=({l,v,min,max,on,u=''})=><label className="block text-xs"><div className="mb-1 flex justify-between"><span>{l}</span><span className="tabular-nums" style={{color:'var(--mu)'}}>{v}{u}</span></div><input type="range" min={min} max={max} value={v} onChange={e=>on(+e.target.value)}/></label>;
const Chk=({l,v,on})=><label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={v} onChange={e=>on(e.target.checked)} style={{accentColor:'var(--tx)'}}/>{l}</label>;

function Heat({t,s,theme,sel,setSel}){
 const {cols,cells}=grid(s.period,s.ws),pal=palette(s,theme),z=s.size,g=s.gap;
 const sc=useRef(null);useEffect(()=>{if(sc.current)sc.current.scrollLeft=sc.current.scrollWidth},[s.period,s.size,s.gap,s.days]);
 const ml=[];let last=-1;
 for(let c=0;c<cols;c++){const f=cells.slice(c*7,c*7+7).find(x=>x.on);if(f&&f.d.getMonth()!==last){last=f.d.getMonth();ml.push([c,f.d.toLocaleDateString('fr-FR',{month:'short'})])}}
 const rows={display:'grid',gridTemplateRows:`repeat(7,${z}px)`,rowGap:g};
 return <div>
  <div ref={sc} className="overflow-x-auto pb-1" style={{WebkitOverflowScrolling:'touch'}}><div className="inline-flex gap-2">
   {s.days&&<div style={{...rows,marginTop:s.months?18:0,fontSize:10,color:'var(--mu)'}}>{[0,1,2,3,4,5,6].map(i=><span key={i} style={{lineHeight:z+'px'}}>{i%2?DN[(s.ws+i)%7]:''}</span>)}</div>}
   <div>
    {s.months&&<div className="relative" style={{height:18,fontSize:10,color:'var(--mu)'}}>{ml.map(([c,n])=><span key={c} className="absolute" style={{left:c*(z+g)}}>{n}</span>)}</div>}
    <div style={{display:'grid',gridTemplateRows:`repeat(7,${z}px)`,gridAutoFlow:'column',gridAutoColumns:z+'px',gap:g}}>
     {cells.map(c=>{if(!c.on)return<div key={c.k}/>;const e=t.d[c.k],v=e?e.v:0;
      return <button key={c.k} onClick={()=>setSel(sel===c.k?null:c.k)} aria-label={c.k}
       title={`${c.d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})} : ${v}${e&&e.n?' — '+e.n:''}`}
       style={{width:z,height:z,borderRadius:s.radius+'%',background:pal[level(v,s)],boxShadow:sel===c.k?'0 0 0 2px var(--tx)':'none'}}/>})}
    </div></div></div></div>
  {s.legend&&<div className="mt-2 flex items-center justify-end gap-1 text-[10px]" style={{color:'var(--mu)'}}>Moins{pal.map((c,i)=><span key={i} style={{width:z,height:z,background:c,borderRadius:s.radius+'%',display:'inline-block'}}/>)}Plus</div>}
 </div>}

function Tracker({t,i,n,s,theme,setT,move,del}){
 const [sel,setSel]=useState(null),[cf,setCf]=useState(false);
 const st=stats(t.d),e=sel&&t.d[sel]||{v:0,n:''};
 const put=(k,o)=>setT(t.id,x=>{const d={...x.d};if(!(o.v>0)&&!o.n)delete d[k];else d[k]=o;return{...x,d}});
 const today=key(now()),tv=(t.d[today]||{}).v||0;
 const sat=[['Total',st.tot],['Série en cours',st.cur+' j'],['Record',st.best+' j'],['Jours actifs',st.days]];
 return <article className="rounded-xl border p-4" style={{background:s.bg||'var(--card)',borderColor:'var(--bd)'}}>
  <header className="mb-4 flex flex-wrap items-center gap-1">
   <input value={t.name} onChange={e=>setT(t.id,x=>({...x,name:e.target.value}))} aria-label="Nom du tracker" className="min-w-[9rem] flex-1 text-base font-semibold" style={{border:'1px solid transparent',paddingLeft:4}}/>
   <button className="bt tabular-nums" onClick={()=>put(today,{v:tv+1,n:(t.d[today]||{}).n||''})}>Aujourd’hui +1 <span style={{color:'var(--mu)'}}>({tv})</span></button>
   <button className="ib" disabled={i===0} onClick={()=>move(i,-1)} aria-label="Monter"><Ic n="up"/></button>
   <button className="ib" disabled={i===n-1} onClick={()=>move(i,1)} aria-label="Descendre"><Ic n="down"/></button>
   {cf?<button className="bt" onMouseLeave={()=>setCf(false)} onClick={()=>del(t.id)} style={{color:'#e5484d'}}>Confirmer</button>:<button className="ib" onClick={()=>setCf(true)} aria-label="Supprimer"><Ic n="trash"/></button>}
  </header>
  <div className="mb-4 grid grid-cols-2 gap-3 sm:grid-cols-4">{sat.map(([l,v])=><div key={l}><div className="text-xl font-semibold tabular-nums">{v}</div><div className="text-xs" style={{color:'var(--mu)'}}>{l}</div></div>)}</div>
  <Heat t={t} s={s} theme={theme} sel={sel} setSel={setSel}/>
  {sel&&<div className="mt-3 flex flex-wrap items-center gap-2 border-t pt-3" style={{borderColor:'var(--bd)'}}>
   <span className="mr-1 text-xs capitalize" style={{color:'var(--mu)'}}>{new Date(sel+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>
   <button className="ib border" style={{borderColor:'var(--bd)'}} onClick={()=>put(sel,{...e,v:Math.max(0,(e.v||0)-1)})} aria-label="Moins"><Ic n="minus" s={14}/></button>
   <input type="number" inputMode="decimal" min="0" step="any" value={e.v||''} placeholder="0" onChange={x=>put(sel,{...e,v:Math.max(0,parseFloat(x.target.value)||0)})} className="w-16 text-center tabular-nums"/>
   <button className="ib border" style={{borderColor:'var(--bd)'}} onClick={()=>put(sel,{...e,v:(e.v||0)+1})} aria-label="Plus"><Ic n="plus" s={14}/></button>
   <input value={e.n||''} placeholder="Note…" maxLength={140} onChange={x=>put(sel,{...e,n:x.target.value})} className="min-w-[140px] flex-1"/>
   <button className="ib" onClick={()=>setSel(null)} aria-label="Fermer"><Ic n="x" s={14}/></button>
  </div>}
 </article>}

function Settings({st,setS,setSt,close}){
 const s=st.s,[io,setIo]=useState(''),[hx,setHx]=useState(s.base);
 const pick=h=>{setHx(h);let m=h.match(/^rgb\D*(\d+)\D+(\d+)\D+(\d+)/i);if(m)h=r2h(m[1],m[2],m[3]);if(okHex(h))setS({pal:'custom',base:h})};
 const imp=txt=>{try{const o=JSON.parse(txt);if(!Array.isArray(o.t))throw 0;setSt({...DEF,...o,s:{...DEF.s,...o.s}});setIo('')}catch(e){setIo('JSON invalide : vérifiez le contenu.')}};
 const th=(i,v)=>setS({th:s.th.map((x,j)=>j===i?Math.max(0,+v||0):x)});
 return <aside className="fixed bottom-0 right-0 top-0 z-20 w-full overflow-y-auto overscroll-contain border-l px-4 sm:max-w-[340px]" style={{background:'var(--bg)',borderColor:'var(--bd)',paddingTop:'max(8px,env(safe-area-inset-top,0px))',paddingBottom:'env(safe-area-inset-bottom,0px)',paddingLeft:'max(1rem,env(safe-area-inset-left,0px))',paddingRight:'max(1rem,env(safe-area-inset-right,0px))'}}>
  <div className="flex items-center justify-between py-2"><h2 className="font-semibold">Réglages</h2><button className="ib" onClick={close} aria-label="Fermer"><Ic n="x"/></button></div>
  <Sec t="Couleurs">
   <div className="flex flex-wrap items-center gap-2">
    <button title="Monochrome" onClick={()=>setS({pal:'mono'})} className="h-6 w-6 rounded-full" style={{background:'linear-gradient(135deg,#d4d4d8 50%,#3f3f46 50%)',boxShadow:s.pal==='mono'?'0 0 0 2px var(--bg),0 0 0 3.5px var(--tx)':'none'}}/>
    {Object.entries(PAL).map(([k,c])=><button key={k} title={k} onClick={()=>setS({pal:k})} className="h-6 w-6 rounded-full" style={{background:c,boxShadow:s.pal===k?'0 0 0 2px var(--bg),0 0 0 3.5px var(--tx)':'none'}}/>)}
   </div>
   <div className="flex items-center gap-2 text-xs"><input type="color" value={okHex(s.base)&&s.base.length===7?s.base:'#10b981'} onChange={e=>pick(e.target.value)} aria-label="Couleur personnalisée"/><input value={hx} onChange={e=>pick(e.target.value)} placeholder="#10b981 ou rgb(16,185,129)" className="min-w-0 flex-1"/></div>
   {[['empty','Cases vides'],['bg','Fond des cartes']].map(([k,l])=><div key={k} className="flex items-center gap-2 text-xs"><input type="color" value={s[k]||(k==='empty'?'#ebebe8':'#ffffff')} onChange={e=>setS({[k]:e.target.value})} aria-label={l}/><span className="flex-1">{l}</span><button className="bt" onClick={()=>setS({[k]:''})}>Auto</button></div>)}
  </Sec>
  <Sec t="Cases">
   <Rng l="Taille" v={s.size} min={8} max={26} on={v=>setS({size:v})} u=" px"/>
   <Rng l="Espacement" v={s.gap} min={0} max={10} on={v=>setS({gap:v})} u=" px"/>
   <Rng l="Arrondi (carré → cercle)" v={s.radius} min={0} max={50} on={v=>setS({radius:v})} u=" %"/>
  </Sec>
  <Sec t="Période">
   <Seg v={s.period} on={v=>setS({period:v})} o={[['year','Année'],['12m','12 mois'],['6m','6 mois'],['q','Trimestre']]}/>
   <Seg v={s.ws} on={v=>setS({ws:v})} o={[[1,'Lundi'],[0,'Dimanche']]}/>
   <Chk l="Noms des mois" v={s.months} on={v=>setS({months:v})}/><Chk l="Jours de la semaine" v={s.days} on={v=>setS({days:v})}/><Chk l="Légende Moins / Plus" v={s.legend} on={v=>setS({legend:v})}/>
  </Sec>
  <Sec t="Seuils d’intensité">
   <Chk l="Mode binaire (fait / pas fait)" v={s.binary} on={v=>setS({binary:v})}/>
   <div className="grid grid-cols-4 gap-2" style={{opacity:s.binary?.4:1}}>{s.th.map((v,i)=><label key={i} className="text-xs"><span style={{color:'var(--mu)'}}>Niv. {i+1} dès</span><input type="number" min="0" disabled={s.binary} value={v} onChange={e=>th(i,e.target.value)} className="mt-1 w-full tabular-nums"/></label>)}</div>
  </Sec>
  <Sec t="Données">
   <div className="flex flex-wrap gap-2">
    <button className="bt" onClick={()=>setIo(JSON.stringify(st,null,1))}>Exporter</button>
    <button className="bt" onClick={()=>{try{navigator.clipboard.writeText(io||JSON.stringify(st))}catch(e){}}}>Copier</button>
    <button className="bt" onClick={()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,1)],{type:'application/json'}));a.download='isbabi-tracker.json';a.click()}}>Télécharger</button>
    <label className="bt">Fichier…<input type="file" accept=".json" hidden onChange={e=>{const f=e.target.files[0];if(f)f.text().then(imp)}}/></label>
   </div>
   <textarea value={io} onChange={e=>setIo(e.target.value)} rows={5} placeholder="Collez ici un export JSON puis cliquez sur Importer" className="w-full font-mono text-base sm:text-[11px]"/>
   <button className="bt" disabled={!io} onClick={()=>imp(io)}>Importer</button>
  </Sec>
 </aside>}

function App(){
 const [st,setSt]=useState(load),[open,setOpen]=useState(false);
 useEffect(()=>{document.documentElement.dataset.theme=st.theme;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}},[st]);
 const setS=p=>setSt(x=>({...x,s:{...x.s,...p}}));
 const setT=(id,f)=>setSt(x=>({...x,t:x.t.map(t=>t.id===id?f(t):t)}));
 const move=(i,d)=>setSt(x=>{const t=[...x.t];[t[i],t[i+d]]=[t[i+d],t[i]];return{...x,t}});
 const del=id=>setSt(x=>({...x,t:x.t.filter(t=>t.id!==id)}));
 const s={...st.s,period:st.s.period==='q'?'q':st.s.period};
 return <div className="mx-auto max-w-5xl px-4 py-6">
  <div className="mb-5 flex items-center justify-between">
   <h1 className="text-lg font-semibold">Isbabi Tracker</h1>
   <div className="flex items-center gap-1">
    <button className="bt flex items-center gap-1" onClick={()=>setSt(x=>({...x,t:[...x.t,{id:Math.random().toString(36).slice(2,8),name:'Nouveau tracker',d:{}}]}))}><Ic n="plus" s={14}/>Tracker</button>
    <button className="ib" onClick={()=>setSt(x=>({...x,theme:x.theme==='dark'?'light':'dark'}))} aria-label="Changer de thème"><Ic n={st.theme==='dark'?'sun':'moon'}/></button>
    <button className="ib" onClick={()=>setOpen(!open)} aria-label="Réglages"><Ic n="gear"/></button>
   </div>
  </div>
  <div className="space-y-4">
   {st.t.map((t,i)=><Tracker key={t.id} t={t} i={i} n={st.t.length} s={s} theme={st.theme} setT={setT} move={move} del={del}/>)}
   {!st.t.length&&<p className="py-16 text-center" style={{color:'var(--mu)'}}>Aucun tracker. Créez-en un avec « + Tracker ».</p>}
  </div>
  {open&&<Settings st={st} setS={setS} setSt={setSt} close={()=>setOpen(false)}/>}
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
